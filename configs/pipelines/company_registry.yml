pipeline:
  name: company_registry
  sample_row_limit: 10000

sources:
  - name: cnaes
    extractor: http_zip_csv
    uri: https://dados-abertos-rf-cnpj.casadosdados.com.br/arquivos/2026-05-10/Cnaes.zip
    load:
      target_table: raw_company_registry_cnaes
      # Current implementation: overwrite. Production extension points: append_only, upsert.
      strategy: overwrite
      # Required for future upsert strategy.
      unique_key: []
      metadata_columns:
        loaded_at: _loaded_at
        source_reference_date: _source_reference_date
        pipeline_run_id: _pipeline_run_id
    options:
      delimiter: ";"
      encoding: latin1
      has_header: false
      columns:
        - cnae_code
        - cnae_description

  - name: simples
    extractor: http_zip_csv
    uri: https://dados-abertos-rf-cnpj.casadosdados.com.br/arquivos/2026-05-10/Simples.zip
    load:
      target_table: raw_company_registry_simples
      # Current implementation: overwrite. Production extension points: append_only, upsert.
      strategy: overwrite
      # Required for future upsert strategy.
      unique_key: []
      metadata_columns:
        loaded_at: _loaded_at
        source_reference_date: _source_reference_date
        pipeline_run_id: _pipeline_run_id
    options:
      delimiter: ";"
      encoding: latin1
      has_header: false
      columns:
        - company_root_cnpj
        - simples_option
        - simples_option_date
        - simples_exclusion_date
        - mei_option
        - mei_option_date
        - mei_exclusion_date

  - name: companies
    extractor: http_zip_csv
    # Local sample uses the first Receita Federal partition. Production ingestion should handle all Empresas*.zip files.
    uri: https://dados-abertos-rf-cnpj.casadosdados.com.br/arquivos/2026-05-10/Empresas0.zip
    load:
      target_table: raw_company_registry_companies
      # Current implementation: overwrite. Production extension points: append_only, upsert.
      strategy: overwrite
      # Required for future upsert strategy.
      unique_key:
        - company_root_cnpj
      metadata_columns:
        loaded_at: _loaded_at
        source_reference_date: _source_reference_date
        pipeline_run_id: _pipeline_run_id
    options:
      delimiter: ";"
      encoding: latin1
      has_header: false
      columns:
        - company_root_cnpj
        - legal_name
        - legal_nature_code
        - responsible_qualification_code
        - share_capital
        - company_size_code
        - responsible_federative_entity

  - name: establishments
    extractor: http_zip_csv
    # Local sample uses one smaller Receita Federal partition. Production ingestion should handle all Estabelecimentos*.zip files.
    uri: https://dados-abertos-rf-cnpj.casadosdados.com.br/arquivos/2026-05-10/Estabelecimentos1.zip
    load:
      target_table: raw_company_registry_establishments
      # Current implementation: overwrite. Production extension points: append_only, upsert.
      strategy: overwrite
      # Required for future upsert strategy.
      unique_key:
        - full_cnpj
      metadata_columns:
        loaded_at: _loaded_at
        source_reference_date: _source_reference_date
        pipeline_run_id: _pipeline_run_id
    options:
      delimiter: ";"
      encoding: latin1
      has_header: false
      columns:
        - company_root_cnpj
        - branch_order
        - check_digits
        - branch_type_code
        - trade_name
        - registration_status_code
        - registration_status_date
        - registration_status_reason_code
        - foreign_city_name
        - country_code
        - activity_start_date
        - primary_cnae_code
        - secondary_cnae_codes
        - street_type
        - street_name
        - address_number
        - address_complement
        - district
        - postal_code
        - state
        - municipality_code
        - area_code_1
        - phone_1
        - area_code_2
        - phone_2
        - fax_area_code
        - fax_number
        - email
        - special_status
        - special_status_date
