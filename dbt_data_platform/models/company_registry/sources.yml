version: 2

sources:
  - name: company_registry_raw
    schema: main
    description: Raw company registry tables loaded into DuckDB by Prefect ingestion flows.
    tables:
      - name: raw_company_registry_cnaes
        description: Raw CNAE records from the Receita Federal public company registry dataset.
        columns:
          - name: cnae_code
            description: Raw CNAE activity code.
          - name: cnae_description
            description: Raw CNAE activity description.

      - name: raw_company_registry_simples
        description: Raw Simples Nacional records from the Receita Federal public company registry dataset.
        columns:
          - name: company_root_cnpj
            description: Company root CNPJ.
          - name: simples_option
            description: Indicates whether the company has opted into Simples Nacional.
          - name: simples_option_date
            description: Simples Nacional option date in the raw source.
          - name: simples_exclusion_date
            description: Simples Nacional exclusion date in the raw source.
          - name: mei_option
            description: Indicates whether the company has opted into MEI.
          - name: mei_option_date
            description: MEI option date in the raw source.
          - name: mei_exclusion_date
            description: MEI exclusion date in the raw source.

      - name: raw_company_registry_companies
        description: Raw company records from the Receita Federal public company registry dataset.
        columns:
          - name: company_root_cnpj
            description: Company root CNPJ.
          - name: legal_name
            description: Company legal name.
          - name: legal_nature_code
            description: Legal nature code.
          - name: responsible_qualification_code
            description: Responsible person qualification code.
          - name: share_capital
            description: Company share capital in the raw source format.
          - name: company_size_code
            description: Company size code.
          - name: responsible_federative_entity
            description: Federative entity responsible for the company, when applicable.

      - name: raw_company_registry_establishments
        description: Raw establishment records from the Receita Federal public company registry dataset.
        columns:
          - name: company_root_cnpj
            description: Company root CNPJ.
          - name: branch_order
            description: Branch order number.
          - name: check_digits
            description: CNPJ check digits.
          - name: branch_type_code
            description: Branch type code, identifying headquarters or branch.
          - name: trade_name
            description: Establishment trade name.
          - name: registration_status_code
            description: Establishment registration status code.
          - name: registration_status_date
            description: Registration status date in the raw source.
          - name: registration_status_reason_code
            description: Registration status reason code.
          - name: foreign_city_name
            description: Foreign city name, when applicable.
          - name: country_code
            description: Country code, when applicable.
          - name: activity_start_date
            description: Establishment activity start date in the raw source.
          - name: primary_cnae_code
            description: Primary CNAE activity code.
          - name: secondary_cnae_codes
            description: Secondary CNAE activity codes.
          - name: street_type
            description: Address street type.
          - name: street_name
            description: Address street name.
          - name: address_number
            description: Address number.
          - name: address_complement
            description: Address complement.
          - name: district
            description: Address district.
          - name: postal_code
            description: Postal code.
          - name: state
            description: Brazilian state abbreviation.
          - name: municipality_code
            description: Municipality code.
          - name: area_code_1
            description: Primary phone area code.
          - name: phone_1
            description: Primary phone number.
          - name: area_code_2
            description: Secondary phone area code.
          - name: phone_2
            description: Secondary phone number.
          - name: fax_area_code
            description: Fax area code.
          - name: fax_number
            description: Fax number.
          - name: email
            description: Establishment email address.
          - name: special_status
            description: Special status, when applicable.
          - name: special_status_date
            description: Special status date in the raw source.
