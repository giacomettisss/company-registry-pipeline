version: 2

models:
  - name: dim_cnaes
    description: CNAE dimension with derived hierarchy codes for analytical grouping.
    columns:
      - name: cnae_code
        description: Seven-digit CNAE subclass code. This is the model grain.
        tests:
          - not_null
          - unique
      - name: cnae_description
        description: CNAE subclass description.
        tests:
          - not_null
      - name: cnae_division_code
        description: First two digits of the CNAE code.
        tests:
          - not_null
      - name: cnae_group_code
        description: First three digits of the CNAE code.
        tests:
          - not_null
      - name: cnae_class_code
        description: First five digits of the CNAE code.
        tests:
          - not_null
      - name: cnae_subclass_code
        description: Full seven-digit CNAE subclass code.
        tests:
          - not_null
      - name: cnae_subclass_label
        description: Human-readable CNAE subclass label.

  - name: dim_companies
    description: Company dimension at root CNPJ grain with registration attributes and Simples Nacional flags.
    columns:
      - name: company_root_cnpj
        description: Company root CNPJ. This is the model grain.
        tests:
          - not_null
          - unique
      - name: legal_name
        description: Company legal name.
        tests:
          - not_null
      - name: legal_nature_code
        description: Legal nature code standardized to four digits.
        tests:
          - not_null
      - name: responsible_qualification_code
        description: Qualification code of the person responsible for the company.
      - name: share_capital
        description: Current company share capital.
        tests:
          - not_null
      - name: share_capital_range
        description: Analytical range derived from company share capital.
        tests:
          - accepted_values:
              arguments:
                values: ['up_to_10k', '10k_to_100k', '100k_to_1m', 'over_1m']
      - name: company_size_code
        description: Company size code from Receita Federal.
        tests:
          - accepted_values:
              arguments:
                values: ['00', '01', '03', '05']
      - name: company_size_label
        description: Human-readable label derived from company size code.
        tests:
          - accepted_values:
              arguments:
                values: ['not_informed', 'micro_company', 'small_company', 'other', 'unknown']
      - name: responsible_federative_entity
        description: Federative entity responsible for the company, when available.
      - name: is_simples
        description: Boolean flag indicating whether the company is currently marked as Simples Nacional in the sample.
        tests:
          - not_null
      - name: is_mei
        description: Boolean flag indicating whether the company is currently marked as MEI in the sample.
        tests:
          - not_null

  - name: dim_establishments
    description: Establishment dimension at full CNPJ grain with activity, location, status, and contact attributes.
    columns:
      - name: full_cnpj
        description: Full 14-digit establishment CNPJ. This is the model grain.
        tests:
          - not_null
          - unique
      - name: company_root_cnpj
        description: Company root CNPJ standardized to eight digits.
        tests:
          - not_null
      - name: branch_order
        description: Branch order standardized to four digits.
        tests:
          - not_null
      - name: branch_type_code
        description: Branch type code, where 1 is headquarters and 2 is branch.
        tests:
          - accepted_values:
              arguments:
                values: ['1', '2']
      - name: branch_type_label
        description: Human-readable label derived from branch type code.
        tests:
          - accepted_values:
              arguments:
                values: ['headquarters', 'branch', 'unknown']
      - name: is_headquarters
        description: Boolean flag identifying headquarters.
        tests:
          - not_null
      - name: is_branch
        description: Boolean flag identifying branch establishments.
        tests:
          - not_null
      - name: registration_status_code
        description: Registration status code from Receita Federal.
        tests:
          - accepted_values:
              arguments:
                values: ['01', '02', '03', '04', '08']
      - name: registration_status_label
        description: Human-readable label derived from registration status code.
        tests:
          - accepted_values:
              arguments:
                values: ['null', 'active', 'suspended', 'unsuitable', 'closed', 'unknown']
      - name: is_active
        description: Boolean flag derived from active registration status code.
        tests:
          - not_null
      - name: primary_cnae_code
        description: Primary CNAE code standardized to seven digits.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cnaes')
                field: cnae_code
      - name: primary_cnae_description
        description: Primary CNAE description copied from the CNAE dimension.
        tests:
          - not_null
      - name: state
        description: Brazilian state code, when available.
      - name: municipality_code
        description: Municipality code from the source registry.
      - name: has_phone
        description: Boolean flag indicating whether at least one phone number is available.
        tests:
          - not_null
      - name: has_email
        description: Boolean flag indicating whether an email address is available.
        tests:
          - not_null
